<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prenotazione Biblioteca</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Segoe UI", sans-serif;
      padding: 1rem;
    }

    .card {
      border-radius: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
    }

    .slot-badge {
      display: inline-block;
      min-width: 4rem;
      text-align: center;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      margin: 0.25rem;
      color: #000;
    }

    .slot-success { background-color: #d4edda; }
    .slot-already { background-color: #fff3cd; }
    .slot-fail { background-color: #f8d7da; }

    .card-header button {
      text-decoration: none;
      font-weight: 600;
      color: #333;
      width: 100%;
      text-align: left;
    }

    @media (max-width: 576px) {
      .slot-badge {
        font-size: 0.8rem;
        min-width: 3.5rem;
      }
    }
  </style>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-end mb-3">
      <a class="btn btn-outline-secondary btn-sm" href="index.html">Back to Intro</a>
    </div>

    <div class="text-center mb-4">
      <h2>Prenotazione Biblioteca</h2>
      <p class="lead">Controllo connessione e prenotazione automatica</p>
    </div>

    <div id="out"></div>
  </div>

  <!-- Script -->
  <script src="config.local.js"></script>
  <script src="reserve.js?v=1.0.2"></script>
</body>
</html>
